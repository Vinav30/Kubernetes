trigger: none

pool: Vinav

stages:
- stage: terraformdownload
  jobs:
  - job: terraformdownload
    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - powershell: |
        Write-Host "Terraform location:"
        Get-Command terraform -ErrorAction SilentlyContinue
        terraform version
      displayName: Verify Terraform

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
        backendAzureRmUseEntraIdForAuthentication: false
        backendServiceArm: 'Batch18'
        backendAzureRmResourceGroupName: 'vinav'
        backendAzureRmStorageAccountName: 'vinavstg'
        backendAzureRmContainerName: 'test'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
        environmentServiceNameAzureRM: 'Batch18'